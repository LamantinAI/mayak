[pytest]
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (may use external services, test containers)
    e2e: End-to-end tests (full application stack)
asyncio_mode = auto
testpaths = tests
addopts = --ignore=tests/functional --cov=project --cov-report=term-missing --cov-report=xml --cov-fail-under=60
python_files = test_*.py
python_classes = Test*
python_functions = test_*
