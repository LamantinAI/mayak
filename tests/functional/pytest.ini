[pytest]
markers =
    e2e: End-to-end tests (full application stack against real HTTP and a real database)
testpaths = src
# "." is tests/functional (settings/utils); "../.." is the repository root, so functional tests can
# import the real project package and exercise production code against the real driver.
pythonpath = . ../..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
